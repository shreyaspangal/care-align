name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + architecture lint + stories
        run: pnpm lint:arch

      - name: Install Playwright browsers (story tests)
        run: pnpm exec playwright install chromium --with-deps

      - name: Start local Supabase (applies migrations)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - name: Export local Supabase env
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Unit + RLS proof + story tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Phase 2+: eval smoke with cached responses (PRACTICES §6) — added in the
      # same commit as its practice row.
