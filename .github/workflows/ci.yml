name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + architecture lint + stories
        run: pnpm lint:arch

      - name: Unit tests
        run: pnpm test

      # Phase 1+: RLS proof tests against local Supabase (PRACTICES §4).
      # Phase 2+: eval smoke with cached responses (PRACTICES §6).
      # Rule: a job is added here in the SAME commit that adds the practice row.
